{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Bàn - Nhà Hàng Tinh Hoa</title>
    <style>
        /* Đã cập nhật background có ảnh nền và hiệu ứng mờ */
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 40px 10px; 
            background-image: url("{% static '/image/back.jpg' %}");
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; 
            background-repeat: no-repeat;
        }
        
        .booking-container { 
            max-width: 600px; 
            margin: auto; 
            background: rgba(255, 255, 255, 0.95); /* Form trắng hơi trong suốt */
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.5); /* Đổ bóng đậm để nổi bật */
        }

        h2 { text-align: center; color: #d35400; margin-bottom: 20px; font-size: 28px;}
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; color: #333; }
        input[type="text"], input[type="tel"], input[type="date"], input[type="time"], input[type="number"], textarea {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px;
        }
        .deposit-options { display: flex; gap: 10px; margin-top: 10px; }
        .deposit-card {
            flex: 1; padding: 15px; text-align: center; border: 2px solid #eee; border-radius: 8px; cursor: pointer; transition: 0.3s;
        }
        .deposit-card:hover { border-color: #d35400; background-color: #fffaf0; }
        .deposit-card.active { border-color: #d35400; background-color: #d35400; color: white; }
        .submit-btn {
            width: 100%; padding: 15px; background-color: #d35400; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.3s;
        }
        .submit-btn:hover { background-color: #a04000; }
        
        .alert { padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: bold; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="booking-container">
    <h2>🍽️ Đặt Bàn Ngay</h2>
    
    {% if messages %}
        <div class="messages-container">
            {% for message in messages %}
                <div class="alert {% if message.tags == 'error' %}alert-error{% else %}alert-success{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST" action="">
        {% csrf_token %} 
        
        <div class="form-group">
            <label>Tên người đặt (*)</label>
            <input type="text" name="ten_khach_hang" required 
                   maxlength="50" 
                   pattern=".*\S+.*" 
                   oninput="this.setCustomValidity('');"
                   oninvalid="this.setCustomValidity('Vui lòng nhập tên người đặt (tối đa 100 ký tự).')"
                   placeholder="VD: Anh Tấn, Chị Hoa...">
        </div>

        <div class="form-group">
            <label>Số điện thoại (*)</label>
            <input type="tel" name="so_dien_thoai" required pattern="[0-9]{9,10}" 
                   oninput="this.value = this.value.replace(/[^0-9]/g, ''); this.setCustomValidity('');" 
                   oninvalid="this.setCustomValidity('Vui lòng chỉ nhập số, độ dài từ 9 đến 10 chữ số.')"
                   placeholder="0xxxxxxxx">
        </div>

        <div style="display: flex; gap: 15px;">
            <div class="form-group" style="flex: 1;">
                <label>Ngày đến (*)</label>
                <input type="date" name="ngay_dat" id="ngay_dat" required>
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Giờ đến (*)</label>
                <input type="time" name="gio_dat" required>
            </div>
        </div>

        <div class="form-group">
            <label>Số người (*)</label>
            <input type="number" name="so_nguoi" min="1" max="50" required value="2" title="Số người phải lớn hơn 0">
        </div>

        <div class="form-group">
            <label>Ghi chú thêm</label>
            <textarea name="ghi_chu" rows="3" placeholder="Yêu cầu ghế em bé, dị ứng thức ăn, sắp xếp lãng mạn..."></textarea>
        </div>

        <div class="form-group">
            <label>Xác nhận giữ bàn (Tiền cọc sẽ trừ vào hóa đơn)</label>
            <div class="deposit-options">
                <div class="deposit-card active" onclick="selectDeposit(0, this)">
                    <strong>Không cọc</strong><br><small>Chờ xác nhận</small>
                </div>
                <div class="deposit-card" onclick="selectDeposit(500000, this)">
                    <strong>500,000đ</strong><br><small>Bàn Tiêu Chuẩn</small>
                </div>
                <div class="deposit-card" onclick="selectDeposit(1000000, this)">
                    <strong>1,000,000đ</strong><br><small>Bàn VIP / Tiệc</small>
                </div>
            </div>
            <input type="hidden" name="tong_tien_coc" id="input_tien_coc" value="0">
        </div>

        <button type="submit" class="submit-btn" id="btn_submit">Gửi Yêu Cầu Đặt Bàn</button>
    </form>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        let today = new Date().toISOString().split('T')[0];
        document.getElementById('ngay_dat').setAttribute('min', today);
    });

    function selectDeposit(amount, element) {
        document.getElementById('input_tien_coc').value = amount;
        
        let cards = document.getElementsByClassName('deposit-card');
        for(let i = 0; i < cards.length; i++) {
            cards[i].classList.remove('active');
        }
        
        element.classList.add('active');

        let btn = document.getElementById('btn_submit');
        if (amount > 0) {
            let formattedAmount = amount.toLocaleString('vi-VN');
            btn.innerHTML = `Thanh toán cọc: ${formattedAmount}đ`;
        } else {
            btn.innerHTML = `Gửi Yêu Cầu Đặt Bàn`;
        }
    }

    const ngayDatInput = document.getElementById('ngay_dat');
    const gioDatInput = document.querySelector('input[name="gio_dat"]');

    function kiemTraThoiGian() {
        if (ngayDatInput.value && gioDatInput.value) {
            let thoiGianChon = new Date(ngayDatInput.value + 'T' + gioDatInput.value);
            let thoiGianHienTai = new Date();

            if (thoiGianChon < thoiGianHienTai) {
                gioDatInput.setCustomValidity('Không thể đặt bàn trong quá khứ. Vui lòng chọn lại giờ!');
            } else {
                gioDatInput.setCustomValidity(''); 
            }
        }
    }

    ngayDatInput.addEventListener('change', kiemTraThoiGian);
    gioDatInput.addEventListener('input', kiemTraThoiGian);

</script>

</body>
</html>
